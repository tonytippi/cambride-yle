# Internal deployment: PostgreSQL, a one-shot migration and the app.
# All configuration and secrets come from .env.production (see .env.production.example); .env stays for local development.
name: cambridgeyle

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: cambridgeyle
      POSTGRES_DB: cambridgeyle
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambridgeyle -d cambridgeyle"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    env_file: .env.production
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Bound to loopback only; the Cloudflare tunnel connects to http://127.0.0.1:${APP_PORT:-9100}.
    ports:
      - "127.0.0.1:${APP_PORT:-9100}:3000"

volumes:
  db-data:
