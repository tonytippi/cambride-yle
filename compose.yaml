# Internal test deployment: PostgreSQL, a one-shot migration and the app.
# Secrets come from .env; APP_ORIGIN is the public HTTPS origin served by the Cloudflare tunnel.
name: cambridgeyle

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://cambridgeyle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cambridgeyle

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambridgeyle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cambridgeyle
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambridgeyle -d cambridgeyle"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    environment: *app-environment
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      GOOGLE_OIDC_REDIRECT_URI: ${APP_ORIGIN:?set APP_ORIGIN in .env}/api/auth/google/callback
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Bound to loopback only; the Cloudflare tunnel connects to http://127.0.0.1:${APP_PORT:-3000}.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  db-data:
